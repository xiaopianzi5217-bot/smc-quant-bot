name: Sync to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          echo "Starting clean history sync to Hugging Face Space..."

          # --- Create orphan branch to strip large file history (local/GitHub history untouched) ---
          git branch -D clean-history 2>/dev/null || true
          git checkout --orphan clean-history
          git config --global user.email "bot@example.com"
          git config --global user.name "GitHub-Sync-Bot"
          git add -A
          git commit -m "Force deploy clean state to Hugging Face"
          git branch -D main
          git branch -m clean-history main

          # --- Configure HF remote (idempotent) ---
          HF_URL="https://Aisvbo:${HF_TOKEN}@huggingface.co/spaces/Aisvbo/svb-bot"
          git remote remove hf 2>/dev/null || true
          git remote add hf "${HF_URL}"

          # --- Rate-limit aware retry: only retry on 429/network errors ---
          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=10

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Push attempt $ATTEMPT / $MAX_ATTEMPTS ..."

            # Capture exit code separately to avoid pipefail interference
            set +e
            git push --force hf main:main > /tmp/push.log 2>&1
            PUSH_EXIT=$?
            set -e

            if [ "$PUSH_EXIT" -eq 0 ]; then
              echo "[SUCCESS] Synced to Hugging Face!"
              exit 0
            fi

            # Only retry on rate-limit/network-class errors
            if ! grep -qE "429|rate limit|remote end hung up|timed out|Could not read from remote|curl 56|HTTP/2 stream" /tmp/push.log; then
              echo "[FATAL] Non-rate-limit error, aborting retries."
              cat /tmp/push.log
              exit 1
            fi

            echo "Rate limit or network error detected:"
            tail -3 /tmp/push.log

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "[ERROR] $MAX_ATTEMPTS attempts failed. Please trigger manually later."
              exit 1
            fi

            echo "Exponential backoff: retrying in $DELAY seconds..."
            sleep "$DELAY"
            DELAY=$((DELAY * 2))
            ATTEMPT=$((ATTEMPT + 1))
          done